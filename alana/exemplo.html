<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Lightbox</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link href="css/lightbox.css" rel="stylesheet" />
</head>
<body>

    <figure>
        <a href="imagens/1.jpg" data-lightbox="roadtrip"><img src="imagens/1.jpg" alt="Área de atendimento da microsoft"></a>
        <a href="imagens/2.jpg" data-lightbox="roadtrip"><img src="imagens/2.jpg" alt="Foto do Amazon Spheres"></a>
        <a href="imagens/3.jpg" data-lightbox="roadtrip"><img src="imagens/3.jpg" alt="Área de lazer com TV e Pebolim"></a>
        <a href="imagens/4.jpg" data-lightbox="roadtrip"><img src="imagens/4.jpg" alt=""></a>
    </figure>
    <script src="js/lightbox.js"></script>
    <script src="js/lightbox-plus-jquery.js"></script>
</body>
</html>
